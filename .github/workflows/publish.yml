name: Publish to PyPI

# Publishes the package to PyPI using PyPI Trusted Publishing (OIDC).
# No API token is stored in the repository.
#
# One-time setup required (see CONTRIBUTING.md → "Publishing"):
#   1. Create the project on PyPI (name: agent-forge) or reserve it.
#   2. On PyPI, add a Trusted Publisher with:
#        Owner:       YANLEI0817
#        Repository:  agentforge
#        Workflow:    publish.yml
#        Environment: pypi
#   3. Run this workflow by publishing a GitHub Release (or manually).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Safety switch: only publish once PyPI Trusted Publishing is configured.
    # Set the repository variable PYPI_ENABLED=true (Settings → Variables) to enable.
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-forge
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
